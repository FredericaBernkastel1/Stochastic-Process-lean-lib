name = "stochlean"
version = "0.1.0"
keywords = ["mathematics", "probability", "stochastic-processes", "lean"]
defaultTargets = ["StochLean"]

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"

[[require]]
name = "exchangeability"
git = "https://github.com/cameronfreer/exchangeability.git"
rev = "e0532e59ceff23edab44dda9ab0655debbc9cc22"

[[require]]
name = "kolmogorov_extension4"
git = "https://github.com/RemyDegenne/kolmogorov_extension4.git"
rev = "7d76e184c3d2138a2741baf923b57e9a01b9cf25"

[[lean_lib]]
name = "StochLean"
weakLeanArgs = ["--memory=24000", "--threads=3"]
