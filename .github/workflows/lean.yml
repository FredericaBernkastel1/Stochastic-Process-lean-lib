name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - name: Kernel axiom audit
        run: lake env lean Audit/Axioms.lean
      - name: Reject project placeholders and axioms
        shell: bash
        run: |
          if grep -REn '\b(sorry|admit)\b|^[[:space:]]*axiom\b' StochLean StochLean.lean Audit; then
            exit 1
          fi
